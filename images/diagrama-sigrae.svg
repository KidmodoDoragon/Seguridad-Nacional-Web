<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo estilo Blueprint -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00ffff" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  
  <rect width="1000" height="750" fill="#0f1419"/>
  <rect width="1000" height="750" fill="url(#grid)"/>
  
  <!-- Título -->
  <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle" fill="#00ffff">
    Arquitectura SIGRAE: Red Distribuida Resiliente
  </text>
  
  <!-- Línea separadora -->
  <line x1="100" y1="70" x2="900" y2="70" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
  
  <!-- HUB CENTRAL (arriba) -->
  <g>
    <circle cx="500" cy="140" r="45" fill="#00ffff" opacity="0.2" stroke="#00ffff" stroke-width="2"/>
    <circle cx="500" cy="140" r="35" fill="none" stroke="#00ffff" stroke-width="2"/>
    <text x="500" y="135" font-size="16" font-weight="bold" text-anchor="middle" fill="#00ffff">HUB</text>
    <text x="500" y="153" font-size="12" text-anchor="middle" fill="#00ffff">CENTRAL</text>
    
    <!-- Pulso de conexión -->
    <circle cx="500" cy="140" r="55" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.5">
      <animate attributeName="r" from="55" to="75" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.5" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- NODOS TERRITORIALES (4 esquinas + 4 laterales) -->
  <!-- Nodo 1: Noroeste -->
  <g>
    <circle cx="200" cy="280" r="35" fill="#00ff00" opacity="0.15" stroke="#00ff00" stroke-width="2"/>
    <rect x="190" y="270" width="20" height="20" fill="#00ff00" opacity="0.4" stroke="#00ff00" stroke-width="1"/>
    <text x="200" y="335" font-size="12" text-anchor="middle" fill="#00ff00" font-weight="bold">NODO 1</text>
    <text x="200" y="350" font-size="11" text-anchor="middle" fill="#888">Occidente</text>
  </g>
  
  <!-- Nodo 2: Noreste -->
  <g>
    <circle cx="800" cy="280" r="35" fill="#00ff00" opacity="0.15" stroke="#00ff00" stroke-width="2"/>
    <rect x="790" y="270" width="20" height="20" fill="#00ff00" opacity="0.4" stroke="#00ff00" stroke-width="1"/>
    <text x="800" y="335" font-size="12" text-anchor="middle" fill="#00ff00" font-weight="bold">NODO 2</text>
    <text x="800" y="350" font-size="11" text-anchor="middle" fill="#888">Centro</text>
  </g>
  
  <!-- Nodo 3: Suroeste -->
  <g>
    <circle cx="200" cy="520" r="35" fill="#00ff00" opacity="0.15" stroke="#00ff00" stroke-width="2"/>
    <rect x="190" y="510" width="20" height="20" fill="#00ff00" opacity="0.4" stroke="#00ff00" stroke-width="1"/>
    <text x="200" y="575" font-size="12" text-anchor="middle" fill="#00ff00" font-weight="bold">NODO 3</text>
    <text x="200" y="590" font-size="11" text-anchor="middle" fill="#888">Oriente</text>
  </g>
  
  <!-- Nodo 4: Sureste -->
  <g>
    <circle cx="800" cy="520" r="35" fill="#00ff00" opacity="0.15" stroke="#00ff00" stroke-width="2"/>
    <rect x="790" y="510" width="20" height="20" fill="#00ff00" opacity="0.4" stroke="#00ff00" stroke-width="1"/>
    <text x="800" y="575" font-size="12" text-anchor="middle" fill="#00ff00" font-weight="bold">NODO 4</text>
    <text x="800" y="590" font-size="11" text-anchor="middle" fill="#888">Caribeño</text>
  </g>
  
  <!-- Nodo 5: Lateral Izquierdo -->
  <g>
    <circle cx="100" cy="400" r="30" fill="#00ff00" opacity="0.1" stroke="#ff6600" stroke-width="2"/>
    <rect x="92" y="392" width="16" height="16" fill="#ff6600" opacity="0.3" stroke="#ff6600" stroke-width="1"/>
    <text x="100" y="450" font-size="11" text-anchor="middle" fill="#ff6600" font-weight="bold">NODO 5</text>
    <text x="100" y="463" font-size="9" text-anchor="middle" fill="#666">Respaldo</text>
  </g>
  
  <!-- Nodo 6: Lateral Derecho -->
  <g>
    <circle cx="900" cy="400" r="30" fill="#00ff00" opacity="0.1" stroke="#ff6600" stroke-width="2"/>
    <rect x="892" y="392" width="16" height="16" fill="#ff6600" opacity="0.3" stroke="#ff6600" stroke-width="1"/>
    <text x="900" y="450" font-size="11" text-anchor="middle" fill="#ff6600" font-weight="bold">NODO 6</text>
    <text x="900" y="463" font-size="9" text-anchor="middle" fill="#666">Respaldo</text>
  </g>
  
  <!-- CONEXIONES (Líneas de red) -->
  <!-- Hub a nodos principales -->
  <line x1="500" y1="185" x2="200" y2="280" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="185" x2="800" y2="280" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="185" x2="200" y2="520" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="185" x2="800" y2="520" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  
  <!-- Hub a nodos de respaldo -->
  <line x1="500" y1="140" x2="100" y2="400" stroke="#ff6600" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,5"/>
  <line x1="500" y1="140" x2="900" y2="400" stroke="#ff6600" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Conexiones entre nodos (malla redundante) -->
  <line x1="200" y1="280" x2="800" y2="280" stroke="#00ff00" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="520" x2="800" y2="520" stroke="#00ff00" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="280" x2="200" y2="520" stroke="#00ff00" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="280" x2="800" y2="520" stroke="#00ff00" stroke-width="1" opacity="0.3"/>
  
  <!-- LEYENDA FUNCIONAL -->
  <text x="100" y="650" font-size="14" font-weight="bold" fill="#00ffff">CARACTERÍSTICAS:</text>
  
  <g>
    <circle cx="120" cy="675" r="6" fill="#00ffff"/>
    <text x="140" y="680" font-size="12" fill="#fff">Sincronización automática entre nodos</text>
  </g>
  
  <g>
    <circle cx="120" cy="700" r="6" fill="#00ff00"/>
    <text x="140" y="705" font-size="12" fill="#fff">Operación autónoma si hub central cae</text>
  </g>
  
  <g>
    <circle cx="550" cy="675" r="6" fill="#ff6600"/>
    <text x="570" y="680" font-size="12" fill="#fff">Nodos de respaldo geográficamente dispersos</text>
  </g>
  
  <g>
    <rect x="550" y="697" width="12" height="12" fill="none" stroke="#00ffff" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="570" y="706" font-size="12" fill="#fff">Cualquier nodo puede asumir rol central</text>
  </g>
  
  <!-- Footer -->
  <text x="500" y="730" font-size="11" text-anchor="middle" fill="#888" font-style="italic">
    Sistema descentralizado con resiliencia territorial - capacidad de operar sin coordinación central hasta 90 días
  </text>
</svg>