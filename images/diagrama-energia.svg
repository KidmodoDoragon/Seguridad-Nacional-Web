<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Título -->
  <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Jerarquía de Priorización Energética en Emergencias
  </text>
  
  <!-- Línea separadora -->
  <line x1="100" y1="70" x2="900" y2="70" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- NIVEL 1: URGENTE (Rojo) -->
  <g>
    <!-- Rectángulo nivel 1 -->
    <rect x="100" y="120" width="800" height="110" fill="#dc3545" opacity="0.9" rx="5" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Ícono hospital -->
    <rect x="140" y="150" width="60" height="60" fill="white" opacity="0.3" rx="3"/>
    <rect x="165" y="145" width="10" height="70" fill="white"/>
    <rect x="150" y="160" width="40" height="10" fill="white"/>
    
    <!-- Ícono escudo militar -->
    <path d="M 270 120 Q 240 140 240 170 Q 240 210 270 230 Q 300 210 300 170 Q 300 140 270 120" fill="white" opacity="0.3" stroke="white" stroke-width="2"/>
    
    <!-- Centro de control -->
    <circle cx="390" cy="175" r="30" fill="white" opacity="0.3" stroke="white" stroke-width="2"/>
    <line x1="375" y1="175" x2="405" y2="175" stroke="white" stroke-width="2"/>
    <line x1="390" y1="160" x2="390" y2="190" stroke="white" stroke-width="2"/>
    
    <!-- Texto -->
    <text x="520" y="145" font-size="24" font-weight="bold" fill="white">NIVEL 1: HOSPITALES, DEFENSA, MANDO</text>
    <text x="520" y="175" font-size="14" fill="white">Energía continua 24/7 - Suministro garantizado incluso con cortes generales</text>
    
    <!-- Porcentaje -->
    <text x="750" y="190" font-size="32" font-weight="bold" fill="white">50%</text>
  </g>
  
  <!-- NIVEL 2: IMPORTANTE (Amarillo) -->
  <g>
    <!-- Rectángulo nivel 2 -->
    <rect x="100" y="250" width="800" height="130" fill="#ffc107" opacity="0.92" rx="5" stroke="#ff9800" stroke-width="2"/>
    
    <!-- Ícono agricultura -->
    <line x1="155" y1="310" x2="155" y2="350" stroke="#333" stroke-width="3"/>
    <path d="M 145 320 Q 155 310 165 320" fill="#28a745" stroke="#333" stroke-width="1"/>
    
    <!-- Ícono agua -->
    <circle cx="270" cy="320" r="20" fill="#87ceeb" opacity="0.7" stroke="#333" stroke-width="2"/>
    <line x1="270" y1="335" x2="270" y2="360" stroke="#333" stroke-width="2"/>
    
    <!-- Ícono industria de alimentos -->
    <rect x="380" y="300" width="50" height="60" fill="#8b4513" opacity="0.5" stroke="#333" stroke-width="2" rx="3"/>
    <rect x="390" y="310" width="8" height="40" fill="#dfd" stroke="#333" stroke-width="1"/>
    <rect x="408" y="310" width="8" height="40" fill="#dfd" stroke="#333" stroke-width="1"/>
    <rect x="426" y="310" width="8" height="40" fill="#dfd" stroke="#333" stroke-width="1"/>
    
    <!-- Transporte de suministros -->
    <rect x="520" y="315" width="50" height="25" fill="#666" stroke="#333" stroke-width="2" rx="3"/>
    <circle cx="535" cy="340" r="8" fill="#333"/>
    <circle cx="555" cy="340" r="8" fill="#333"/>
    
    <!-- Texto -->
    <text x="100" y="375" font-size="20" font-weight="bold" fill="#333">NIVEL 2: ALIMENTOS, AGUA, TRANSPORTES CRÍTICOS</text>
    <text x="100" y="400" font-size="13" fill="#333">Horarios regulados - Suministro cada 12-18 horas según disponibilidad</text>
    
    <!-- Porcentaje -->
    <text x="750" y="330" font-size="32" font-weight="bold" fill="#333">30%</text>
  </g>
  
  <!-- NIVEL 3: NO VITAL (Gris) -->
  <g>
    <!-- Rectángulo nivel 3 -->
    <rect x="100" y="410" width="800" height="120" fill="#95a5a6" opacity="0.85" rx="5" stroke="#7f8c8d" stroke-width="2"/>
    
    <!-- Ícono oficial privado (no vital) -->
    <rect x="120" y="445" width="80" height="70" fill="#bdc3c7" opacity="0.5" stroke="#7f8c8d" stroke-width="2" rx="3"/>
    <rect x="140" y="455" width="15" height="15" fill="none" stroke="#7f8c8d" stroke-width="1"/>
    <rect x="160" y="455" width="15" height="15" fill="none" stroke="#7f8c8d" stroke-width="1"/>
    
    <!-- Ícono consumo doméstico -->
    <path d="M 250 445 L 280 445 L 290 460 L 260 460 Z" fill="#bdc3c7" opacity="0.5" stroke="#7f8c8d" stroke-width="2"/>
    <circle cx="265" cy="470" r="8" fill="none" stroke="#7f8c8d" stroke-width="2"/>
    
    <!-- Línea cortada -->
    <line x1="380" y1="445" x2="420" y2="445" stroke="#dc3545" stroke-width="4"/>
    <text x="460" y="455" font-size="16" font-weight="bold" fill="#dc3545">DESCONEXIÓN</text>
    
    <!-- Texto -->
    <text x="100" y="535" font-size="20" font-weight="bold" fill="white">NIVEL 3: COMERCIOS, SERVICIOS NO ESENCIALES, CONSUMO DOMÉSTICO</text>
    <text x="100" y="560" font-size="13" fill="white">Corte total o parcial según severidad - Servicio interdiario o solo fines de semana</text>
    
    <!-- Porcentaje -->
    <text x="750" y="495" font-size="32" font-weight="bold" fill="white">20%</text>
  </g>
  
  <!-- Leyenda -->
  <rect x="50" y="660" width="900" height="1" fill="#e0e0e0"/>
  <text x="500" y="685" font-size="12" text-anchor="middle" fill="#666" font-style="italic">
    La jerarquía garantiza supervivencia de funciones críticas bajo desgaste prolongado de recursos energéticos
  </text>
</svg>