<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Título -->
  <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Demandas de Guerra: Tres Pilares Estratégicos
  </text>
  
  <!-- Línea separadora -->
  <line x1="100" y1="70" x2="900" y2="70" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- PILAR 1: FAR (Izquierda) -->
  <g>
    <!-- Escudo -->
    <rect x="80" y="150" width="200" height="280" rx="10" fill="#dc3545" opacity="0.9"/>
    <path d="M 180 150 Q 100 180 100 250 Q 100 380 180 420 Q 260 380 260 250 Q 260 180 180 150" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    
    <!-- Espada -->
    <line x1="180" y1="180" x2="180" y2="340" stroke="#ffd700" stroke-width="8" stroke-linecap="round"/>
    <circle cx="180" cy="175" r="8" fill="#ffd700"/>
    
    <!-- Etiqueta -->
    <text x="180" y="380" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      FAR Y DEFENSA
    </text>
    <text x="180" y="405" font-size="13" text-anchor="middle" fill="white">
      Armamento
    </text>
    <text x="180" y="422" font-size="13" text-anchor="middle" fill="white">
      Logística Militar
    </text>
  </g>
  
  <!-- PILAR 2: POBLACIÓN (Centro) -->
  <g>
    <!-- Cornucopia/Alimentos -->
    <rect x="400" y="150" width="200" height="280" rx="10" fill="#28a745" opacity="0.9"/>
    
    <!-- Cesto -->
    <path d="M 430 250 L 570 250 L 560 380 L 440 380 Z" fill="#f8d7da" stroke="#d32f2f" stroke-width="2"/>
    
    <!-- Alimentos (manzanas/productos) -->
    <circle cx="470" cy="280" r="15" fill="#ff6b6b"/>
    <circle cx="510" cy="290" r="15" fill="#ffaa00"/>
    <circle cx="530" cy="310" r="15" fill="#ff6b6b"/>
    <circle cx="490" cy="335" r="15" fill="#ffaa00"/>
    
    <!-- Agua -->
    <rect x="510" y="350" width="30" height="25" fill="#87ceeb" opacity="0.7"/>
    
    <!-- Medicinas -->
    <rect x="450" y="355" width="20" height="20" fill="#ffffff" stroke="#dc3545" stroke-width="2"/>
    <line x1="460" y1="350" x2="460" y2="375" stroke="#dc3545" stroke-width="2"/>
    <line x1="450" y1="362" x2="470" y2="362" stroke="#dc3545" stroke-width="2"/>
    
    <!-- Etiqueta -->
    <text x="500" y="405" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      POBLACIÓN
    </text>
    <text x="500" y="427" font-size="12" text-anchor="middle" fill="white">
      Alimentos, Agua, Medicinas
    </text>
  </g>
  
  <!-- PILAR 3: ECONOMÍA (Derecha) -->
  <g>
    <!-- Fábrica -->
    <rect x="720" y="180" width="180" height="200" fill="#3d5a80" opacity="0.9" rx="5"/>
    
    <!-- Chimenea -->
    <rect x="760" y="120" width="30" height="70" fill="#666"/>
    <circle cx="775" cy="110" r="15" fill="#999"/>
    
    <!-- Humo -->
    <circle cx="775" cy="95" r="8" fill="#ccc" opacity="0.6"/>
    <circle cx="775" cy="75" r="10" fill="#ddd" opacity="0.4"/>
    
    <!-- Ventanas -->
    <rect x="730" y="200" width="25" height="25" fill="#ffff99"/>
    <rect x="765" y="200" width="25" height="25" fill="#ffff99"/>
    <rect x="800" y="200" width="25" height="25" fill="#ffff99"/>
    
    <rect x="730" y="240" width="25" height="25" fill="#ffff99"/>
    <rect x="765" y="240" width="25" height="25" fill="#ffff99"/>
    <rect x="800" y="240" width="25" height="25" fill="#ffff99"/>
    
    <!-- Puerta -->
    <rect x="785" y="310" width="25" height="45" fill="#8b4513"/>
    <circle cx="805" cy="332" r="3" fill="#ffd700"/>
    
    <!-- Engranaje (representa producción) -->
    <g transform="translate(820, 360)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#ffd700" stroke-width="2"/>
      <circle cx="0" cy="0" r="15" fill="none" stroke="#ffd700" stroke-width="2"/>
      <line x1="-10" y1="0" x2="-20" y2="0" stroke="#ffd700" stroke-width="2"/>
      <line x1="10" y1="0" x2="20" y2="0" stroke="#ffd700" stroke-width="2"/>
    </g>
    
    <!-- Etiqueta -->
    <text x="810" y="405" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      ECONOMÍA
    </text>
    <text x="810" y="427" font-size="12" text-anchor="middle" fill="white">
      Producción y Servicios
    </text>
  </g>
  
  <!-- Flechas conectoras -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Flecha hacia abajo -->
  <text x="500" y="520" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Coordinación integrada de recursos
  </text>
  <path d="M 500 480 L 500 550" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Pie de página -->
  <text x="500" y="580" font-size="12" text-anchor="middle" fill="#666" font-style="italic">
    En tiempo de guerra, los tres pilares funcionan en unidad bajo dirección estatal única
  </text>
</svg>