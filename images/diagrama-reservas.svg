<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Título -->
  <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Ciclo de Gestión de Reservas Materiales
  </text>
  
  <!-- Línea separadora -->
  <line x1="100" y1="70" x2="900" y2="70" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Centro circular almacén -->
  <circle cx="500" cy="380" r="80" fill="#3d5a80" opacity="0.95" stroke="#2c3e50" stroke-width="3"/>
  <text x="500" y="375" font-size="18" font-weight="bold" text-anchor="middle" fill="white">ALMACÉN</text>
  <text x="500" y="395" font-size="18" font-weight="bold" text-anchor="middle" fill="white">ESTRATÉGICO</text>
  
  <!-- Flechas y etapas circulares -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
    <marker id="arrowhead-gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ffd700"/>
    </marker>
  </defs>
  
  <!-- ETAPA 1: ACUMULACIÓN (Arriba) -->
  <g>
    <circle cx="500" cy="150" r="60" fill="#e74c3c" opacity="0.85" stroke="#c0392b" stroke-width="2"/>
    <text x="500" y="145" font-size="22" font-weight="bold" text-anchor="middle" fill="white">1</text>
    <text x="500" y="165" font-size="16" font-weight="bold" text-anchor="middle" fill="white">ACUMULACIÓN</text>
    
    <!-- Flecha hacia abajo -->
    <path d="M 500 210 Q 480 300 460 320" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="450" y="270" font-size="12" fill="#2c3e50" font-weight="bold">Acopiar</text>
    
    <!-- Ícono de entrada de recursos -->
    <path d="M 450 100 L 500 130 L 550 100" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  </g>
  
  <!-- ETAPA 2: CONSERVACIÓN (Izquierda) -->
  <g>
    <circle cx="250" cy="380" r="60" fill="#f39c12" opacity="0.85" stroke="#d68910" stroke-width="2"/>
    <text x="250" y="375" font-size="22" font-weight="bold" text-anchor="middle" fill="white">2</text>
    <text x="250" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="white">CONSERVACIÓN</text>
    
    <!-- Flecha hacia derecha -->
    <path d="M 310 380 L 420 380" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="350" y="365" font-size="12" fill="#2c3e50" font-weight="bold">Mantener</text>
    
    <!-- Ícono de almacenamiento -->
    <rect x="210" y="330" width="80" height="60" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="3"/>
    <line x1="250" y1="330" x2="250" y2="390" stroke="#95a5a6" stroke-width="1"/>
    <line x1="210" y1="345" x2="290" y2="345" stroke="#95a5a6" stroke-width="1"/>
  </g>
  
  <!-- ETAPA 3: ROTACIÓN (Abajo) -->
  <g>
    <circle cx="500" cy="610" r="60" fill="#27ae60" opacity="0.85" stroke="#229954" stroke-width="2"/>
    <text x="500" y="605" font-size="22" font-weight="bold" text-anchor="middle" fill="white">3</text>
    <text x="500" y="625" font-size="16" font-weight="bold" text-anchor="middle" fill="white">ROTACIÓN</text>
    
    <!-- Flecha hacia arriba -->
    <path d="M 500 540 Q 520 480 540 440" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="560" y="490" font-size="12" fill="#2c3e50" font-weight="bold">Renovar</text>
    
    <!-- Ícono de ciclo -->
    <path d="M 480 600 Q 460 580 470 560" fill="none" stroke="#229954" stroke-width="2"/>
    <path d="M 520 600 Q 540 580 530 560" fill="none" stroke="#229954" stroke-width="2"/>
  </g>
  
  <!-- ETAPA 4: INSPECCIÓN (Derecha) -->
  <g>
    <circle cx="750" cy="380" r="60" fill="#3498db" opacity="0.85" stroke="#2980b9" stroke-width="2"/>
    <text x="750" y="375" font-size="22" font-weight="bold" text-anchor="middle" fill="white">4</text>
    <text x="750" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="white">INSPECCIÓN</text>
    
    <!-- Flecha hacia izquierda -->
    <path d="M 690 380 L 580 380" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="620" y="365" font-size="12" fill="#2c3e50" font-weight="bold">Verificar</text>
    
    <!-- Ícono de control -->
    <circle cx="750" cy="330" r="8" fill="none" stroke="#2980b9" stroke-width="2"/>
    <line x1="750" y1="330" x2="740" y2="340" stroke="#2980b9" stroke-width="2"/>
    <line x1="750" y1="330" x2="760" y2="340" stroke="#2980b9" stroke-width="2"/>
  </g>
  
  <!-- Información en el almacén -->
  <text x="500" y="345" font-size="11" text-anchor="middle" fill="#fff">Inviolable</text>
  <text x="500" y="410" font-size="11" text-anchor="middle" fill="#fff">Control:Cant/Calidad</text>
  
  <!-- Leyenda abajo -->
  <rect x="50" y="680" width="900" height="1" fill="#e0e0e0"/>
  <text x="500" y="695" font-size="13" text-anchor="middle" fill="#666">
    Ciclo continuo: Los recursos se acumulan, conservan, rotan y se inspeccionan regularmente para garantizar disponibilidad y calidad
  </text>
</svg>